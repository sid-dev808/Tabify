services:
  # --- Backend: Flask Web Service ---
  - type: web
    name: tabify-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # One worker only: transcription jobs are held in this process's memory,
    # so a second worker would not see jobs created by the first. Threads give
    # concurrency for downloads; the long timeout covers slow transcriptions.
    startCommand: "gunicorn app:app --workers 1 --threads 4 --timeout 300"
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false          # set manually in dashboard (secret)
      - key: FRONTEND_URL
        value: https://tabify-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.10.4

  # --- Frontend: React Static Site ---
  - type: web
    name: tabify-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://tabify-backend.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA routing fallback
