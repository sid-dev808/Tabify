services:
  # --- Backend: Flask Web Service ---
  - type: web
    name: my-app-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false          # set manually in dashboard (secret)
      - key: FRONTEND_URL
        value: https://my-app-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9

  # --- Frontend: React Static Site ---
  - type: web
    name: my-app-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist    # use ./build if Create React App, ./dist if Vite
    envVars:
      - key: VITE_API_URL
        value: https://my-app-backend.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA routing fallback